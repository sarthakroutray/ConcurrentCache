services:
  cache:
    build:
      context: .
      dockerfile: Dockerfile
    image: concurrent-cache:local
    ports:
      - "8080:8080"
    environment:
      CACHE_IMPLEMENTATION: global
      CACHE_CAPACITY: "10000"
      CACHE_SEGMENTS: "16"
      CACHE_DEFAULT_TTL: 60s
      CACHE_MAX_VALUE_LENGTH: "4096"
      CACHE_SWEEP_INTERVAL: 30s
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
