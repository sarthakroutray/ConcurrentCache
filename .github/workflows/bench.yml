name: Benchmarks

# Benchmarks are too slow and too sensitive to noisy shared runners to gate a
# pull request, so they run on demand and on release tags only.
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  jmh:
    name: JMH throughput
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record runner specs
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)'
          free -h

      - name: Build the benchmark jar
        run: mvn $MAVEN_ARGS -pl cache-bench -am package -DskipTests

      - name: Run JMH
        run: |
          java -jar cache-bench/target/benchmarks.jar \
            -rf json -rff bench-results.json | tee bench-output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            bench-results.json
            bench-output.txt
          if-no-files-found: error
          retention-days: 30
